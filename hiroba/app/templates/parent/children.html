{% extends "parent/base.html" %}

{% block content %}
<div class="hiroba-card">
  <h2 style="margin-top:0; font-size:18px;">👧🧑 キッズアカウントの管理</h2>
  <p style="color: var(--hiroba-text-soft); font-size:14px;">
    お子さまのプロフィール（なまえ・アイコン・がくねん）を編集できます。
  </p>
  <a href="/parent/children/new" class="hiroba-btn hiroba-btn--orange" style="text-decoration:none; display:block; text-align:center; margin-top:10px;">
    ➕ 新しいキッズを追加する
  </a>

  <div id="kid-list" style="margin-top:18px;">
    <div class="hiroba-loading">よみこみちゅう…</div>
  </div>
</div>

<!-- 編集モーダル -->
<div id="edit-kid-modal" class="hiroba-modal-overlay" style="display:none;">
  <div class="hiroba-modal">
    <div style="text-align:center; font-size:20px; font-weight:700;">プロフィールを編集</div>
    <input id="edit-kid-name-input" class="hiroba-auth-input" type="text" placeholder="なまえ">
    <div style="font-size:13px; color:var(--hiroba-text-soft); margin:8px 0 4px;">アイコン</div>
    <div class="hiroba-emoji-grid" id="edit-emoji-grid"></div>
    <div style="font-size:13px; color:var(--hiroba-text-soft); margin:8px 0 4px;">がくねん</div>
    <div class="hiroba-emoji-grid" id="edit-grade-grid" style="flex-wrap:wrap;"></div>
    <div id="edit-kid-error" class="hiroba-auth-error"></div>
    <button id="edit-kid-submit-btn" class="hiroba-btn hiroba-btn--orange">保存する</button>
    <button id="edit-kid-cancel-btn" class="hiroba-btn hiroba-btn--pink">とじる</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  var AVATAR_EMOJIS = ["🐱", "🐶", "🐰", "🦊", "🐻", "🐼", "🦁", "🐸", "🐵", "🐨", "🐯", "🦄"];
  var GRADE_OPTIONS = ["年少", "年中", "年長", "小1", "小2", "小3", "小4", "小5", "小6", "中1", "中2", "中3"];
  var editingKidId = null;
  var editSelectedEmoji = AVATAR_EMOJIS[0];
  var editSelectedGrade = "";

  async function loadKids() {
    var list = document.getElementById("kid-list");
    try {
      var res = await fetch("/api/auth/kids");
      var data = await res.json();
      if (!res.ok) throw new Error((data && data.detail) || "取得に失敗しました");
      var kids = data.kids || [];
      if (kids.length === 0) {
        list.innerHTML = "<p>まだキッズアカウントがありません。</p>";
        return;
      }
      list.innerHTML = kids.map(renderKidRow).join("");
      list.querySelectorAll(".edit-kid-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          openEditModal(kids.find(function (k) { return String(k.id) === btn.dataset.kidId; }));
        });
      });
    } catch (e) {
      list.innerHTML = "<p>読み込みに失敗しました。</p>";
    }
  }

  function renderKidRow(kid) {
    return (
      '<div style="display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #eee;">' +
      '  <div class="hiroba-post-avatar" style="width:52px; height:52px; font-size:26px;">' + (kid.avatar_icon || "🧒") + '</div>' +
      '  <div style="flex:1;">' +
      '    <div style="font-weight:700; font-size:16px;">' + escapeHtml(kid.display_name) + '</div>' +
      '    <div style="font-size:13px; color:var(--hiroba-text-soft);">' + (kid.grade || "がくねん未設定") + '</div>' +
      '  </div>' +
      '  <button type="button" class="hiroba-btn hiroba-btn--blue edit-kid-btn" data-kid-id="' + kid.id + '" style="min-height:40px; font-size:14px; padding:0 16px; width:auto;">編集</button>' +
      '</div>'
    );
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/[&<>"']/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
  }

  function buildEmojiGrid(gridId, onPick, currentValue) {
    var grid = document.getElementById(gridId);
    grid.innerHTML = "";
    AVATAR_EMOJIS.forEach(function (emoji) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "hiroba-emoji-choice" + (emoji === currentValue ? " is-selected" : "");
      b.textContent = emoji;
      b.addEventListener("click", function () {
        onPick(emoji);
        grid.querySelectorAll(".hiroba-emoji-choice").forEach(function (el) { el.classList.remove("is-selected"); });
        b.classList.add("is-selected");
      });
      grid.appendChild(b);
    });
  }

  function buildGradeGrid(gridId, onPick, currentValue) {
    var grid = document.getElementById(gridId);
    grid.innerHTML = "";
    GRADE_OPTIONS.forEach(function (grade) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "hiroba-emoji-choice" + (grade === currentValue ? " is-selected" : "");
      b.style.fontSize = "15px";
      b.style.width = "auto";
      b.style.padding = "0 14px";
      b.textContent = grade;
      b.addEventListener("click", function () {
        var next = (onPick.current === grade) ? "" : grade;
        onPick.current = next;
        onPick(next);
        grid.querySelectorAll(".hiroba-emoji-choice").forEach(function (el) { el.classList.remove("is-selected"); });
        if (next) b.classList.add("is-selected");
      });
      grid.appendChild(b);
    });
  }

  function openEditModal(kid) {
    if (!kid) return;
    editingKidId = kid.id;
    editSelectedEmoji = kid.avatar_icon || AVATAR_EMOJIS[0];
    editSelectedGrade = kid.grade || "";
    document.getElementById("edit-kid-name-input").value = kid.display_name || "";
    document.getElementById("edit-kid-error").textContent = "";

    buildEmojiGrid("edit-emoji-grid", function (emoji) { editSelectedEmoji = emoji; }, editSelectedEmoji);

    var gradePicker = function (val) { editSelectedGrade = val; };
    gradePicker.current = editSelectedGrade;
    buildGradeGrid("edit-grade-grid", gradePicker, editSelectedGrade);

    document.getElementById("edit-kid-modal").style.display = "flex";
  }

  document.getElementById("edit-kid-cancel-btn").addEventListener("click", function () {
    document.getElementById("edit-kid-modal").style.display = "none";
  });

  document.getElementById("edit-kid-submit-btn").addEventListener("click", async function () {
    var name = document.getElementById("edit-kid-name-input").value.trim();
    var errorEl = document.getElementById("edit-kid-error");
    errorEl.textContent = "";
    if (!name) {
      errorEl.textContent = "なまえを 入力してください";
      return;
    }
    try {
      var fd = new FormData();
      fd.append("display_name", name);
      fd.append("avatar_icon", editSelectedEmoji);
      fd.append("grade", editSelectedGrade);
      var res = await fetch("/api/auth/kids/" + editingKidId + "/update", { method: "POST", body: fd });
      var data = await res.json();
      if (!res.ok) throw new Error((data && data.detail) || "保存に失敗しました");
      document.getElementById("edit-kid-modal").style.display = "none";
      loadKids();
    } catch (e) {
      errorEl.textContent = e.message;
    }
  });

  loadKids();
})();
</script>
{% endblock %}
