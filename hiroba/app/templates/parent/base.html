<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name|default("ひろば") }} - 保護者用</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/kids_theme.css') }}">
</head>
<body class="hiroba-parent">
  <div class="hiroba-app">
    <header class="hiroba-header" style="flex-direction:column; gap:4px; align-items:stretch;">
      <a href="/parent/dashboard" style="text-decoration:none; text-align:center;">
        <span class="hiroba-logo" style="font-size: 22px;">ひろば（保護者用）</span>
      </a>
      {% if active and active != 'dashboard' %}
      <a href="/parent/dashboard" class="hiroba-parent-back-link" style="justify-content:center; display:flex;">
        ⬅ おうちの人の部屋トップへ
      </a>
      {% endif %}
    </header>
    <main class="hiroba-main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', path='js/kids_common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
