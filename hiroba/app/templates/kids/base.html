<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{ app_name|default("ひろば") }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/kids_theme.css') }}">
</head>
<body>
  <div class="hiroba-app">
    {% block header %}
    <header class="hiroba-header">
      <a href="/" style="text-decoration:none;">
        <span class="hiroba-logo">🏞️ ひろば</span>
      </a>
    </header>
    {% endblock %}

    <main class="hiroba-main">
      {% block content %}{% endblock %}
    </main>

    {% block nav %}
    <nav class="hiroba-nav">
      <a href="/kids/home" class="hiroba-nav-item {% if active == 'home' %}is-active{% endif %}">
        <span class="hiroba-nav-icon">&#x1F3DE;&#xFE0F;</span>
        <span class="hiroba-nav-label">ひろば</span>
      </a>
      <a href="/kids/create" class="hiroba-nav-item {% if active == 'create' %}is-active{% endif %}">
        <span class="hiroba-nav-icon">&#x1F3A8;</span>
        <span class="hiroba-nav-label">つくる</span>
      </a>
      <a href="/kids/ochanoma" class="hiroba-nav-item {% if active == 'ochanoma' %}is-active{% endif %}">
        <span class="hiroba-nav-icon">&#x1F375;</span>
        <span class="hiroba-nav-label">おちゃのま</span>
      </a>
      <a href="/kids/rooms" class="hiroba-nav-item {% if active == 'rooms' %}is-active{% endif %}">
        <span class="hiroba-nav-icon">&#x1F3E0;</span>
        <span class="hiroba-nav-label">おへや</span>
      </a>
      <a href="/kids/oyako" class="hiroba-nav-item {% if active == 'oyako' %}is-active{% endif %}">

        <span class="hiroba-nav-icon">&#x1F46A;</span>
        <span class="hiroba-nav-label">おうちひと</span>
      </a>

    </nav>
    {% endblock %}
  </div>


  <script src="{{ url_for('static', path='js/kids_common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
