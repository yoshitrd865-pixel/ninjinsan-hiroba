{% extends "kids/base.html" %}

{% block content %}
<div id="invitation-card" class="hiroba-card" style="display:none; text-align:center;">
  <div class="hiroba-section-title" style="justify-content:center;">💌 おへやの おさそいがきてるよ！</div>
  <div id="invitation-list"></div>
</div>

<div class="hiroba-card" style="text-align:center;">
  <div class="hiroba-section-title" style="justify-content:center;">🏠 わたしのおへや</div>
  <p style="color:var(--hiroba-text-soft); margin:0 0 16px;">なかよしの おともだちだけの ひみつの おへや！</p>
  <button type="button" id="create-room-btn" class="hiroba-btn hiroba-btn--xl hiroba-btn--orange">
    <span class="hiroba-btn-icon">➕</span> おへやを つくる！
  </button>
</div>

<div class="hiroba-card">
  <div id="room-list">
    <div class="hiroba-loading">よみこみちゅう… 🌀</div>
  </div>
</div>

<!-- おへや作成モーダル -->
<div id="create-room-modal" class="hiroba-modal-overlay" style="display:none;">
  <div class="hiroba-modal">
    <div style="text-align:center; font-size:20px; font-weight:700;">🏠 どんな おへや？</div>
    <div class="hiroba-emoji-grid" id="room-icon-grid" style="margin-top:14px;"></div>
    <div id="create-room-error" class="hiroba-auth-error"></div>
    <button type="button" id="create-room-submit-btn" class="hiroba-btn hiroba-btn--xl hiroba-btn--green" style="margin-top:10px;">
      <span class="hiroba-btn-icon">✨</span> つくる！
    </button>
    <button type="button" id="create-room-cancel-btn" class="hiroba-btn hiroba-btn--pink">やめる</button>
  </div>
</div>

<!-- おともだち招待モーダル -->
<div id="invite-modal" class="hiroba-modal-overlay" style="display:none;">
  <div class="hiroba-modal">
    <div style="text-align:center; font-size:20px; font-weight:700;">💌 だれを しょうたいする？</div>
    <div id="invite-friend-grid" class="hiroba-kid-grid" style="margin-top:16px;">
      <div class="hiroba-loading">よみこみちゅう…</div>
    </div>
    <div id="invite-error" class="hiroba-auth-error"></div>
    <button type="button" id="invite-close-btn" class="hiroba-btn hiroba-btn--pink" style="margin-top:10px;">とじる</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  var ROOM_ICONS = ["🏠", "🏡", "🎮", "🎨", "⚽", "🐶", "🐱", "🌈", "⭐", "🍀", "🎈", "🍭"];
  var selectedIcon = ROOM_ICONS[0];
  var currentInviteRoomId = null;

  /* -------------------- おさそい一覧 -------------------- */
  async function loadInvitations() {
    var card = document.getElementById("invitation-card");
    var list = document.getElementById("invitation-list");
    try {
      var data = await Hiroba.api("/api/rooms/invitations");
      var invitations = (data && data.invitations) || [];
      if (invitations.length === 0) {
        card.style.display = "none";
        return;
      }
      card.style.display = "block";
      list.innerHTML = invitations.map(renderInvitationRow).join("");
      list.querySelectorAll("[data-accept-membership-id]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          respondInvitation(parseInt(btn.getAttribute("data-accept-membership-id"), 10), "accept");
        });
      });
      list.querySelectorAll("[data-decline-membership-id]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          respondInvitation(parseInt(btn.getAttribute("data-decline-membership-id"), 10), "decline");
        });
      });
    } catch (e) {
      card.style.display = "none";
    }
  }

  function renderInvitationRow(inv) {
    var roomLabel = (inv.room.icon || "🏠") + " " + Hiroba.escapeHtml(inv.room.name);
    if (inv.status === "accepted") {
      return (
        '<div class="hiroba-card" style="padding:14px; margin-top:12px;">' +
        '  <div style="font-weight:700;">' + roomLabel + '</div>' +
        '  <div style="color:var(--hiroba-text-soft); margin-top:6px;">おうちのひとに かくにんしてもらってるよ😊</div>' +
        '</div>'
      );
    }
    return (
      '<div class="hiroba-card" style="padding:14px; margin-top:12px;">' +
      '  <div style="font-weight:700;">' + roomLabel + '</div>' +
      '  <div style="display:flex; gap:10px; margin-top:10px;">' +
      '    <button type="button" class="hiroba-btn hiroba-btn--green" style="flex:1;" data-accept-membership-id="' + inv.membership_id + '">💌 さんかする</button>' +
      '    <button type="button" class="hiroba-btn hiroba-btn--pink" style="flex:1;" data-decline-membership-id="' + inv.membership_id + '">やめておく</button>' +
      '  </div>' +
      '</div>'
    );
  }

  async function respondInvitation(membershipId, decision) {
    try {
      var fd = new FormData();
      fd.append("decision", decision);
      await Hiroba.api("/api/rooms/invitations/" + membershipId + "/respond", { method: "POST", body: fd });
      loadInvitations();
      loadRooms();
    } catch (e) {
      /* noop */
    }
  }

  /* -------------------- わたしのおへや 一覧 -------------------- */
  async function loadRooms() {
    var list = document.getElementById("room-list");
    try {
      var data = await Hiroba.api("/api/rooms/my-rooms");
      var rooms = (data && data.rooms) || [];
      if (rooms.length === 0) {
        list.innerHTML =
          '<div class="hiroba-empty-state">' +
          '  <span class="emoji">🏠</span>' +
          '  まだ おへやが ないよ！<br>「おへやを つくる！」から はじめてみよう。' +
          '</div>';
        return;
      }
      list.innerHTML = rooms.map(renderRoomCard).join("");
      list.querySelectorAll("[data-invite-room-id]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          openInviteModal(parseInt(btn.getAttribute("data-invite-room-id"), 10));
        });
      });
    } catch (e) {
      if (e.status === 401) {
        window.location.href = "/login";
        return;
      }
      list.innerHTML = '<div class="hiroba-empty-state"><span class="emoji">😢</span>よみこみに しっぱいしちゃった…</div>';
    }
  }

  function renderRoomCard(room) {
    return (
      '<div class="hiroba-card hiroba-fade-in" style="padding:18px; margin-bottom:14px; display:flex; align-items:center; gap:14px;">' +
      '  <div class="hiroba-post-avatar" style="width:64px; height:64px; font-size:34px;">' + (room.icon || "🏠") + '</div>' +
      '  <div style="flex:1; font-size:20px; font-weight:800;">' + Hiroba.escapeHtml(room.name) + '</div>' +
      '  <button type="button" class="hiroba-tool-btn" data-invite-room-id="' + room.id + '">💌 しょうたい</button>' +
      '</div>'
    );
  }

  /* -------------------- おへや作成 -------------------- */
  var createModal = document.getElementById("create-room-modal");

  function buildIconGrid() {
    var grid = document.getElementById("room-icon-grid");
    ROOM_ICONS.forEach(function (icon, i) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "hiroba-emoji-choice" + (i === 0 ? " is-selected" : "");
      btn.textContent = icon;
      btn.addEventListener("click", function () {
        selectedIcon = icon;
        grid.querySelectorAll(".hiroba-emoji-choice").forEach(function (el) {
          el.classList.remove("is-selected");
        });
        btn.classList.add("is-selected");
      });
      grid.appendChild(btn);
    });
  }

  document.getElementById("create-room-btn").addEventListener("click", function () {
    document.getElementById("create-room-error").textContent = "";
    createModal.style.display = "flex";
  });
  document.getElementById("create-room-cancel-btn").addEventListener("click", function () {
    createModal.style.display = "none";
  });

  document.getElementById("create-room-submit-btn").addEventListener("click", async function () {
    var errorEl = document.getElementById("create-room-error");
    errorEl.textContent = "";
    var btn = this;
    btn.disabled = true;
    var originalHtml = btn.innerHTML;
    btn.innerHTML = '<span class="hiroba-btn-icon">⏳</span> つくってるよ…';
    try {
      var fd = new FormData();
      fd.append("name", "おへや");
      fd.append("icon", selectedIcon);
      await Hiroba.api("/api/rooms/create", { method: "POST", body: fd });
      createModal.style.display = "none";
      loadRooms();
    } catch (e) {
      errorEl.textContent = e.message || "つくるのに しっぱいしちゃった…";
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    }
  });

  /* -------------------- おともだち招待 -------------------- */
  var inviteModal = document.getElementById("invite-modal");

  async function openInviteModal(roomId) {
    currentInviteRoomId = roomId;
    document.getElementById("invite-error").textContent = "";
    inviteModal.style.display = "flex";
    var grid = document.getElementById("invite-friend-grid");
    grid.innerHTML = '<div class="hiroba-loading">よみこみちゅう…</div>';
    try {
      var data = await Hiroba.api("/api/promises/other-kids");
      var kids = (data && data.kids) || [];
      if (kids.length === 0) {
        grid.innerHTML = '<div class="hiroba-empty-state" style="grid-column: 1 / -1;">まだ ほかの キッズが いないみたい…</div>';
        return;
      }
      grid.innerHTML = "";
      kids.forEach(function (kid) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "hiroba-kid-avatar-btn";
        btn.innerHTML =
          '<div class="hiroba-kid-avatar-circle">' + (kid.avatar_icon || "🧒") + '</div>' +
          '<div class="hiroba-kid-name">' + Hiroba.escapeHtml(kid.display_name) + '</div>';
        btn.addEventListener("click", function () {
          inviteFriend(kid.id, btn);
        });
        grid.appendChild(btn);
      });
    } catch (e) {
      grid.innerHTML = '<div class="hiroba-empty-state" style="grid-column: 1 / -1;">よみこみに しっぱいしちゃった…</div>';
    }
  }

  async function inviteFriend(kidId, btn) {
    var errorEl = document.getElementById("invite-error");
    errorEl.textContent = "";
    btn.disabled = true;
    try {
      var fd = new FormData();
      fd.append("receiver_kid_id", kidId);
      await Hiroba.api("/api/rooms/" + currentInviteRoomId + "/invite", { method: "POST", body: fd });
      btn.querySelector(".hiroba-kid-name").textContent = "しょうたい ずみ！";
    } catch (e) {
      errorEl.textContent = e.message || "しょうたいに しっぱいしちゃった…";
      btn.disabled = false;
    }
  }

  document.getElementById("invite-close-btn").addEventListener("click", function () {
    inviteModal.style.display = "none";
  });

  buildIconGrid();

  Hiroba.requireLogin().then(function (user) {
    if (user) {
      loadInvitations();
      loadRooms();
    }
  });
})();
</script>
{% endblock %}
