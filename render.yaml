services:
  # 既存アプリ「縁側」
  - type: web
    name: engawa
    env: python
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    autoDeploy: true

  # 新規アプリ「ひろば」（キッズ向けSNS）
  # rootDir を指定することで、同一リポジトリ内の hiroba/ ディレクトリを
  # このサービス専用のルートとしてビルド・起動する（縁側とは完全に分離）
  - type: web
    name: hiroba
    env: python
    plan: free
    region: singapore
    rootDir: hiroba
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HIROBA_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
    autoDeploy: true


